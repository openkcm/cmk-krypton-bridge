application:
  name: cmk-krypton-bridge
  buildInfo:
    version: 0.1.0

logger:
  level: debug
  format: json

grpcServer:
  enabled: true
  address: ":9092"

kryptonClient:
  mockMode: false
  address: "ing.worker01.kms.shoot.gardener.cc-one.showroom.apeirora.eu:443"
  secretRef:
    type: tls

orbital:
  enabled: false
  mustVerifySig: false

keyHierarchy:
  maxDepth: 4

database:
  dsn: "postgres://user:pass@localhost:5432/cmk_krypton_bridge?sslmode=disable"

worker:
  concurrency: 3
  pollInterval: 500ms
  maxAttempts: 10
  stuckTimeout: 5m
