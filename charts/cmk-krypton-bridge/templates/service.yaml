---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cmk-krypton-bridge.fullname" . }}
  namespace: {{ include "cmk-krypton-bridge.namespace" . }}
  labels:
    {{- include "cmk-krypton-bridge.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.ports }}
  ports:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "cmk-krypton-bridge.selectorLabels" . | nindent 4 }}
