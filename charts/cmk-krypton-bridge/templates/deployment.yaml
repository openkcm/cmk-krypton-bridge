apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cmk-krypton-bridge.fullname" . }}
  labels:
    {{- include "cmk-krypton-bridge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cmk-krypton-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cmk-krypton-bridge.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cmk-krypton-bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: KRYPTON_PROXY_DATABASE_DSN
              {{- if .Values.database.secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: DATABASE_DSN
              {{- else }}
              value: {{ .Values.database.dsn | quote }}
              {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/cmk-krypton-bridge
              readOnly: true
            {{- if .Values.orbital.rabbitmq.secretName }}
            - name: rabbitmq-credentials
              mountPath: /etc/credentials/rabbitmq
              readOnly: true
            {{- end }}
          args:
            - --config=/etc/cmk-krypton-bridge/config.yaml
      volumes:
        - name: config
          configMap:
            name: {{ include "cmk-krypton-bridge.fullname" . }}
        {{- if .Values.orbital.rabbitmq.secretName }}
        - name: rabbitmq-credentials
          secret:
            secretName: {{ .Values.orbital.rabbitmq.secretName }}
        {{- end }}
